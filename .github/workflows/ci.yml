name: Smart City CI — AI Enhanced

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest test_smart_city.py -v 2>&1 | tee test_output.txt; exit ${PIPESTATUS[0]}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: AI Analysis of failures
        if: failure()
        run: cat test_output.txt | python ai_analyzer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
