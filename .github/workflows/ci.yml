name: Smart City CI — AI Enhanced

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest test_smart_city.py -v 2>&1 | tee test_output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          if [ $TEST_EXIT -ne 0 ]; then
            echo "Tests failed. Running AI analysis..."
            cat test_output.txt | python ai_analyzer.py
          fi
          exit $TEST_EXIT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}